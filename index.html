<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearts for Me</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff5f8;
    --card: #ffffff;
    --pink: #ff5c8a;
    --pink-soft: #ffd1de;
    --text: #4a2b36;
    --muted: #a27d89;
    --empty: #f3e3e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Mali", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 520px; }
  h1 { text-align: center; font-size: 1.6rem; margin: 0 0 4px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(255, 92, 138, .12);
    margin-bottom: 16px;
  }
  .count { text-align: center; }
  .count b { font-size: 3rem; color: var(--pink); }
  .count span { color: var(--muted); }
  .bar { height: 14px; background: var(--empty); border-radius: 99px; overflow: hidden; margin: 12px 0 4px; }
  .bar div { height: 100%; width: 0; background: linear-gradient(90deg, #ff9ab6, var(--pink)); transition: width .4s ease; }
  .left { text-align: center; color: var(--muted); font-size: .9rem; }
  .sync { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 4px; min-height: 1em; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .grid svg { width: 100%; height: auto; display: block; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button {
    font: inherit; font-weight: 600;
    border: none; border-radius: 16px;
    padding: 14px 8px;
    background: var(--pink-soft); color: var(--text);
    cursor: pointer; transition: transform .1s;
  }
  button:active { transform: scale(.95); }
  button.main { background: var(--pink); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .custom { display: flex; gap: 10px; margin-top: 10px; }
  .custom input {
    flex: 1; min-width: 0; font: inherit;
    border: 2px solid var(--pink-soft); border-radius: 16px;
    padding: 12px; text-align: center; color: var(--text);
  }
  .custom input:focus { outline: none; border-color: var(--pink); }
  .take { width: 100%; margin-top: 10px; background: none; border: 2px dashed var(--pink-soft); color: var(--muted); font-weight: 400; }
  .ask-btns { display: grid; gap: 8px; margin-top: 14px; }
  .ask-btns .quiet { background: none; color: var(--muted); font-weight: 400; }
  .tools { display: flex; justify-content: space-between; margin-top: 12px; }
  .tools button { background: none; color: var(--muted); padding: 6px; font-weight: 400; font-size: .9rem; }
  .log { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; font-size: .9rem; }
  .log li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--pink-soft); }
  .log li span { color: var(--muted); }
  .log .empty { color: var(--muted); justify-content: center; border: none; }
  h2 { font-size: 1rem; margin: 0 0 8px; }

  .win {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(255, 245, 248, .92); z-index: 10; padding: 16px;
  }
  .win.show { display: flex; }
  .win .card { text-align: center; max-width: 360px; animation: pop .5s ease; }
  .win .big { font-size: 4rem; animation: beat 1s infinite; }
  .win h2 { font-size: 1.5rem; color: var(--pink); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @keyframes beat { 50% { transform: scale(1.15); } }

  .buddy { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 8px; }
  .bubble {
    position: relative; background: var(--pink-soft); border-radius: 18px;
    padding: 10px 16px; text-align: center; font-weight: 600; max-width: 90%;
    animation: pop .35s ease;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px;
    border: 8px solid transparent; border-bottom: 0; border-top-color: var(--pink-soft);
  }
  .avatar-wrap { width: 280px; max-width: 100%; aspect-ratio: 1; margin-top: 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .avatar {
    position: relative; width: 100%; height: 100%; user-select: none;
    transform-origin: 50% 90%;
    animation: bob 2.4s ease-in-out infinite;
  }
  .avatar img, .avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .avatar img { mix-blend-mode: multiply; } /* blends the image's white background into the card */
  .avatar img.front { mix-blend-mode: normal; } /* the paws, cut out so clothes sit behind them */

  .clothes .hat, .clothes .shirt, .clothes .pants { display: none; }
  .clothes.hat-1 .h1, .clothes.hat-2 .h2, .clothes.hat-3 .h3,
  .clothes.shirt-1 .s1, .clothes.shirt-2 .s2, .clothes.shirt-3 .s3,
  .clothes.pants-1 .p1, .clothes.pants-2 .p2, .clothes.pants-3 .p3 { display: inline; }
  .wardrobe .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .wardrobe .row > b { width: 54px; font-size: .9rem; }
  .wardrobe .opts { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .wardrobe .opts button { padding: 8px 2px; font-size: .8rem; font-weight: 400; background: var(--empty); line-height: 1.2; }
  .wardrobe .opts button.on { background: var(--pink); color: #fff; font-weight: 600; }
  .wardrobe .opts button i { display: block; font-style: normal; font-size: 1.3rem; }
  .dots span { display: inline-block; animation: dot 1.4s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }

  .buddy.waiting .avatar { animation: wait 3.2s ease-in-out infinite; filter: saturate(.75); }
  .buddy.happy .avatar { animation: jump .9s ease-in-out 3; }
  .buddy.love .avatar { animation: beat .8s ease-in-out infinite; }
  .buddy.poke .avatar { animation: wiggle .5s ease-in-out; }

  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes wait {
    0%, 100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-6deg) translateY(3px); }
    50% { transform: rotate(0) translateY(6px) scale(.97); }
    75% { transform: rotate(6deg) translateY(3px); }
  }
  @keyframes jump {
    0%, 100% { transform: translateY(0) scale(1); }
    15% { transform: translateY(0) scale(1.08, .9); }
    45% { transform: translateY(-34px) rotate(-8deg) scale(.95, 1.06); }
    70% { transform: translateY(0) rotate(6deg) scale(1.06, .94); }
  }
  @keyframes wiggle { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---- animated face drawn over bear.webp (its own eyes and mouth were painted out) ---- */
  .face * { transform-box: fill-box; transform-origin: center; }
  .face .e-closed, .face .e-heart, .face .e-poke,
  .face .m-tongue, .face .m-open, .face .m-frown, .face .tear,
  .face .e-cry, .face .tears, .face .m-cry { display: none; }

  /* cry: a heart was taken back — eyes squeezed shut, tears streaming, wailing */
  .buddy.cry .avatar { animation: sob .3s ease-in-out infinite; filter: saturate(.8); }
  .buddy.cry .e-open { display: none; }
  .buddy.cry .e-cry, .buddy.cry .tears { display: inline; }
  .buddy.cry .stream { animation: stream .9s ease-in-out infinite alternate; }
  .buddy.cry .drop { animation: drip 1s ease-in infinite; }
  .buddy.cry .drop:nth-of-type(2) { animation-delay: .5s; }
  .buddy.cry .m-smile { display: none; }
  .buddy.cry .m-cry { display: inline; animation: wail .25s ease-in-out infinite alternate; }
  @keyframes sob { 50% { transform: translateY(3px) scale(1.01, .98); } }
  @keyframes stream { from { transform: scaleY(.85); opacity: .75; } to { transform: scaleY(1.05); opacity: .95; } }
  @keyframes drip { from { transform: translateY(0); opacity: 1; } to { transform: translateY(120px); opacity: 0; } }
  @keyframes wail { to { transform: scale(1.08, .85); } }

  /* waiting: big watery puppy eyes looking up, trembling frown */
  .buddy.waiting .tear { display: inline; animation: shimmer 1.6s ease-in-out infinite; }
  .buddy.waiting .iris { animation: puppy 7s ease-in-out infinite; }
  .buddy.waiting .m-smile { display: none; }
  .buddy.waiting .m-frown { display: inline; animation: tremble .5s ease-in-out infinite; }

  /* content: glancing around, little ω smile */
  .buddy.content .iris { animation: glance 6s ease-in-out infinite; }

  /* happy: the original wink + tongue out, tongue wiggling */
  .buddy.happy .eye-r .e-open { display: none; }
  .buddy.happy .eye-r .e-closed { display: inline; }
  .buddy.happy .m-smile { display: none; }
  .buddy.happy .m-tongue { display: inline; }
  .buddy.happy .tongue { transform-origin: 30% 10%; animation: lick .35s ease-in-out infinite alternate; }

  /* love: heart eyes, big smile */
  .buddy.love .e-open { display: none; }
  .buddy.love .e-heart { display: inline; animation: beat .8s ease-in-out infinite; }
  .buddy.love .m-smile { display: none; }
  .buddy.love .m-open { display: inline; }

  /* poke: > < squeeze, laughing */
  .buddy.poke .e-open { display: none; }
  .buddy.poke .e-poke { display: inline; }
  .buddy.poke .m-smile { display: none; }
  .buddy.poke .m-open { display: inline; animation: laugh .2s ease-in-out infinite alternate; }

  .e-open { animation: blink 4.2s infinite; }
  .eye-r .e-open { animation-delay: .04s; }

  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes glance {
    0%, 20% { transform: translate(0, 0); }
    30%, 50% { transform: translate(-14px, 4px); }
    60%, 80% { transform: translate(12px, -6px); }
  }
  @keyframes puppy {
    0%, 40% { transform: translate(0, -10px) scale(1.08); }
    50%, 90% { transform: translate(-10px, 16px) scale(1); }
    100% { transform: translate(0, -10px) scale(1.08); }
  }
  @keyframes shimmer { 50% { opacity: .35; } }
  @keyframes tremble { 50% { transform: translateY(2px) scaleX(.94); } }
  @keyframes lick { to { transform: rotate(12deg) scaleY(1.08); } }
  @keyframes laugh { to { transform: scaleY(.75); } }

  .float { position: fixed; pointer-events: none; font-size: 1.6rem; animation: up 1.2s ease-out forwards; z-index: 20; }
  @keyframes up { to { transform: translateY(-140px) scale(1.4); opacity: 0; } }
</style>
</head>
<body>
<main>
  <h1>Kitty, can you give me some hearts? 🥺</h1>
  <p class="sub">Once we hit 100 hearts, we're officially together</p>

  <section class="card buddy" id="buddy">
    <div class="bubble" id="bubble"></div>
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar">
        <img src="bear.webp" alt="Bear buddy with glasses" draggable="false">
        <svg class="clothes" id="clothes" viewBox="0 0 1254 1254" aria-hidden="true">
          <defs>
            <radialGradient id="shade" cx="45%" cy="35%" r="75%">
              <stop offset="55%" stop-color="#000" stop-opacity="0"/>
              <stop offset="100%" stop-color="#000" stop-opacity=".28"/>
            </radialGradient>
            <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
              <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="shirtClip"><path d="M498 838Q690 878 888 796L915 860C928 950 918 1020 893 1052Q720 1090 560 1048C530 990 510 930 498 838Z"/></clipPath>
            <clipPath id="pantsClip"><path d="M545 990L905 996C912 1070 904 1124 890 1166L700 1170Q692 1134 684 1114Q640 1140 570 1128C552 1086 545 1040 545 990Z"/></clipPath>
            <pattern id="stripes" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
              <rect width="60" height="60" fill="#fffaf2"/><rect y="0" width="60" height="26" fill="#6fa8dc"/>
            </pattern>
            <pattern id="plaid" width="70" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
              <rect width="70" height="70" fill="#e9a23b"/>
              <rect width="70" height="22" fill="#c4572e" opacity=".55"/><rect width="22" height="70" fill="#c4572e" opacity=".55"/>
              <rect x="44" width="5" height="70" fill="#fff4d6" opacity=".7"/><rect y="44" width="70" height="5" fill="#fff4d6" opacity=".7"/>
            </pattern>
          </defs>

          <!-- pants (under the shirt hem) -->
          <g class="pants p1" clip-path="url(#pantsClip)">
            <rect x="500" y="970" width="450" height="220" fill="#5b8fd1"/>
            <path d="M560 1030Q720 1052 900 1036M705 1050L700 1168M590 1108Q640 1100 678 1086M712 1146L884 1144" stroke="#f6c66b" stroke-width="5" stroke-dasharray="14 10" fill="none"/>
            <circle cx="728" cy="1046" r="11" fill="#f6c66b"/>
            <rect x="500" y="970" width="450" height="220" fill="url(#shade)"/>
          </g>
          <g class="pants p2" clip-path="url(#pantsClip)">
            <rect x="500" y="970" width="450" height="220" fill="url(#plaid)"/>
            <path d="M705 1050L700 1168" stroke="#8a3a1c" stroke-width="5" opacity=".5"/>
            <rect x="500" y="970" width="450" height="220" fill="url(#shade)"/>
          </g>
          <g class="pants p3" transform="translate(726 1060) scale(1.12 1.25) translate(-726 -1032)">
            <path d="M520 1010Q720 1050 925 1012L960 1100Q930 1130 900 1108Q870 1140 830 1112Q795 1145 760 1116Q725 1148 690 1118Q655 1146 622 1114Q585 1140 556 1106Q520 1124 492 1094Z" fill="#ffb3c9"/>
            <path d="M530 1030Q720 1068 915 1032L940 1080Q905 1104 875 1082Q845 1110 812 1084Q780 1112 748 1088Q716 1114 684 1088Q652 1112 620 1086Q588 1108 560 1080Q534 1094 512 1072Z" fill="#ffd1de"/>
            <path d="M520 1010Q720 1050 925 1012L920 1030Q720 1068 526 1030Z" fill="#ff7fa3"/>
            <circle cx="600" cy="1060" r="5" fill="#fff"/><circle cx="760" cy="1072" r="5" fill="#fff"/><circle cx="870" cy="1056" r="5" fill="#fff"/>
          </g>

          <!-- shirts -->
          <g class="shirt s1">
            <g clip-path="url(#shirtClip)">
              <rect x="480" y="780" width="460" height="320" fill="#e8475f"/>
              <path d="M480 1030Q720 1078 940 1030V1100H480Z" fill="#c9344c"/>
              <path d="M711 922c-18-30-70-24-70 16 0 34 70 70 70 70s70-36 70-70c0-40-52-46-70-16z" fill="#fff5f8"/>
              <rect x="480" y="780" width="460" height="320" fill="url(#shade)"/>
            </g>
            <path d="M498 838Q690 878 888 796" stroke="#c9344c" stroke-width="22" fill="none" stroke-linecap="round"/>
          </g>
          <g class="shirt s2">
            <g clip-path="url(#shirtClip)">
              <rect x="480" y="780" width="460" height="320" fill="url(#stripes)"/>
              <rect x="480" y="780" width="460" height="320" fill="url(#shade)"/>
            </g>
            <path d="M498 838Q690 878 888 796" stroke="#fffaf2" stroke-width="18" fill="none" stroke-linecap="round"/>
            <path d="M498 838Q690 878 888 796" stroke="#6fa8dc" stroke-width="6" fill="none" stroke-linecap="round" transform="translate(0 10)"/>
          </g>
          <g class="shirt s3">
            <g clip-path="url(#shirtClip)">
              <rect x="480" y="780" width="460" height="320" fill="#2f2a3a"/>
              <path d="M640 860L705 1070L780 852Z" fill="#fffaf2"/>
              <path d="M640 860L700 990L612 880ZM780 852L712 990L812 866Z" fill="#3f3850"/>
              <circle cx="706" cy="960" r="7" fill="#2f2a3a"/><circle cx="707" cy="1010" r="7" fill="#2f2a3a"/>
              <rect x="480" y="780" width="460" height="320" fill="url(#shade)"/>
            </g>
            <g transform="translate(708 872) rotate(-10)">
              <path d="M0 0L-58-28Q-66 0-58 28ZM0 0L58-28Q66 0 58 28Z" fill="#e8475f"/>
              <rect x="-14" y="-15" width="28" height="30" rx="9" fill="#c9344c"/>
            </g>
          </g>

          <!-- hats -->
          <g transform="translate(610 238) rotate(-9)">
            <g class="hat h1">
              <path d="M-205 10C-210-190 210-190 205 10Z" fill="#ff8fb1"/>
              <path d="M-120-120V0M-60-150V0M0-160V0M60-150V0M120-120V0" stroke="#ff6f99" stroke-width="10" stroke-linecap="round"/>
              <path d="M-205 10C-210-190 210-190 205 10Z" fill="url(#shade)"/>
              <rect x="-222" y="-20" width="444" height="70" rx="34" fill="#ffd1de"/>
              <path d="M-180-6V36M-130-6V36M-80-6V36M-30-6V36M20-6V36M70-6V36M120-6V36M170-6V36" stroke="#ffb3c9" stroke-width="9" stroke-linecap="round"/>
              <circle cx="0" cy="-166" r="48" fill="#fff5f8"/><circle cx="-14" cy="-180" r="18" fill="#fff" opacity=".8"/>
            </g>
            <g class="hat h2">
              <path d="M-150 20L-170-120L-85-50L0-160L85-50L170-120L150 20Z" fill="#f6c34a" stroke="#d99a1e" stroke-width="10" stroke-linejoin="round"/>
              <path d="M-150 20L-170-120L-85-50L0-160L85-50L170-120L150 20Z" fill="url(#gloss)"/>
              <rect x="-160" y="-8" width="320" height="34" rx="12" fill="#e9a92a"/>
              <circle cx="-170" cy="-128" r="16" fill="#ff8fb1"/><circle cx="0" cy="-168" r="18" fill="#7fc8f8"/><circle cx="170" cy="-128" r="16" fill="#ff8fb1"/>
              <circle cx="-80" cy="9" r="11" fill="#e8475f"/><circle cx="0" cy="9" r="13" fill="#7fc8f8"/><circle cx="80" cy="9" r="11" fill="#e8475f"/>
            </g>
            <g class="hat h3">
              <path d="M-200 20C-205-180 205-180 200 20Z" fill="#6fa8dc"/>
              <path d="M0-150V20M-200 20C-150-40-60-60-40 20M200 20C150-40 60-60 40 20" stroke="#4f86bd" stroke-width="7" fill="none"/>
              <path d="M-200 20C-205-180 205-180 200 20Z" fill="url(#shade)"/>
              <path d="M-200 14Q-40 -6 200 14Q210 70 60 76Q-130 80-200 14Z" fill="#3f6fa3"/>
              <circle cx="0" cy="-150" r="14" fill="#4f86bd"/>
              <path d="M-40-80c-10-17-38-13-38 9 0 19 38 39 38 39s38-20 38-39c0-22-28-26-38-9z" fill="#fff5f8"/>
            </g>
          </g>
        </svg>
        <img class="front" src="bear-hands.webp" alt="" draggable="false">
        <svg class="face" viewBox="0 0 1254 1254" aria-hidden="true">
          <defs>
            <radialGradient id="irisGrad" cx="40%" cy="35%" r="70%">
              <stop offset="0" stop-color="#8a4a26"/>
              <stop offset=".55" stop-color="#4a200e"/>
              <stop offset="1" stop-color="#250c05"/>
            </radialGradient>
            <clipPath id="eyeClip"><ellipse cx="-6" rx="85" ry="80"/></clipPath>
            <path id="heartEye" d="M0 40C-70-10-70-70-30-70C-10-70 0-55 0-45C0-55 10-70 30-70C70-70 70-10 0 40Z"/>
          </defs>

          <g class="eye eye-l" transform="translate(485 563) rotate(-8)">
            <g class="e-open">
              <ellipse rx="98" ry="92" fill="#1d0d07"/>
              <ellipse cx="-6" rx="85" ry="80" fill="#fff"/>
              <g clip-path="url(#eyeClip)">
                <g class="iris">
                  <ellipse cx="16" cy="4" rx="66" ry="74" fill="url(#irisGrad)"/>
                  <ellipse cx="18" cy="8" rx="36" ry="42" fill="#160603"/>
                  <circle cx="44" cy="-30" r="22" fill="#fff"/>
                  <circle cx="-6" cy="40" r="9" fill="#fff" opacity=".85"/>
                </g>
              </g>
              <ellipse class="tear" cx="-4" cy="60" rx="52" ry="9" fill="#fff" opacity=".7"/>
            </g>
            <path class="e-closed" d="M-72 18Q0-58 72 18" fill="none" stroke="#2a1209" stroke-width="20" stroke-linecap="round"/>
            <g class="e-heart"><use href="#heartEye" transform="translate(0 22) scale(1.55)" fill="#ff4b6e"/><ellipse cx="-40" cy="-48" rx="15" ry="9" fill="#fff" opacity=".85"/></g>
            <path class="e-cry" d="M-72 4Q0 40 72 4" fill="none" stroke="#2a1209" stroke-width="20" stroke-linecap="round"/>
            <g class="tears">
              <path class="stream" d="M-80 14Q-84 90 -74 170Q-66 186 -58 170Q-50 90 -54 14Z" fill="#8fd3ff" opacity=".9"/>
              <circle class="drop" cx="-66" cy="180" r="13" fill="#8fd3ff"/>
              <circle class="drop" cx="-66" cy="180" r="10" fill="#b5e3ff"/>
            </g>
            <path class="e-poke" d="M-50-45L45 0-50 45" fill="none" stroke="#2a1209" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <g class="eye eye-r" transform="translate(848 490) rotate(-8)">
            <g class="e-open">
              <ellipse rx="98" ry="92" fill="#1d0d07"/>
              <ellipse cx="-6" rx="85" ry="80" fill="#fff"/>
              <g clip-path="url(#eyeClip)">
                <g class="iris">
                  <ellipse cx="16" cy="4" rx="66" ry="74" fill="url(#irisGrad)"/>
                  <ellipse cx="18" cy="8" rx="36" ry="42" fill="#160603"/>
                  <circle cx="44" cy="-30" r="22" fill="#fff"/>
                  <circle cx="-6" cy="40" r="9" fill="#fff" opacity=".85"/>
                </g>
              </g>
              <ellipse class="tear" cx="-4" cy="60" rx="52" ry="9" fill="#fff" opacity=".7"/>
            </g>
            <path class="e-closed" d="M-72 18Q0-58 72 18" fill="none" stroke="#2a1209" stroke-width="20" stroke-linecap="round"/>
            <g class="e-heart"><use href="#heartEye" transform="translate(0 22) scale(1.55)" fill="#ff4b6e"/><ellipse cx="-40" cy="-48" rx="15" ry="9" fill="#fff" opacity=".85"/></g>
            <path class="e-cry" d="M-72 4Q0 40 72 4" fill="none" stroke="#2a1209" stroke-width="20" stroke-linecap="round"/>
            <g class="tears">
              <path class="stream" d="M52 14Q48 90 58 170Q66 186 74 170Q82 90 78 14Z" fill="#8fd3ff" opacity=".9"/>
              <circle class="drop" cx="66" cy="180" r="13" fill="#8fd3ff"/>
              <circle class="drop" cx="66" cy="180" r="10" fill="#b5e3ff"/>
            </g>
            <path class="e-poke" d="M50-45L-45 0 50 45" fill="none" stroke="#2a1209" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <g class="mouth" transform="translate(692 668) rotate(-14)">
            <path class="m-smile" d="M-58-18Q-30 22 0-8Q30 22 58-18" fill="none" stroke="#3b160c" stroke-width="11" stroke-linecap="round"/>
            <path class="m-frown" d="M-38 22Q0-12 38 22" fill="none" stroke="#3b160c" stroke-width="11" stroke-linecap="round"/>
            <g class="m-tongue">
              <path d="M-88-14Q-10 22 80-66Q96 30 30 76Q-40 92-88-14Z" fill="#4b1010"/>
              <g class="tongue">
                <path d="M-8 26Q40 4 74 22Q86 84 42 96Q2 102-6 62Z" fill="#f37a8d"/>
                <path d="M34 26L38 72" stroke="#d85a70" stroke-width="5" stroke-linecap="round"/>
              </g>
            </g>
            <g class="m-cry">
              <path d="M-62 34Q0-46 62 34Q0 52-62 34Z" fill="#4b1010"/>
              <ellipse cx="0" cy="30" rx="28" ry="10" fill="#f37a8d"/>
            </g>
            <g class="m-open">
              <path d="M-70-12Q0 8 70-12Q62 66 0 74Q-62 66-70-12Z" fill="#4b1010"/>
              <ellipse cx="8" cy="52" rx="34" ry="18" fill="#f37a8d"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </section>

  <section class="card wardrobe">
    <h2>Dress me up, Kitty 👗</h2>
    <div id="wardrobe"></div>
  </section>

  <section class="card">
    <div class="count"><b id="total">0</b> <span>/ 100 hearts</span></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="left" id="left"></div>
    <div class="sync" id="sync"></div>
  </section>

  <section class="card">
    <div class="grid" id="grid"></div>
  </section>

  <section class="card">
    <div class="btns">
      <button data-add="0.5">+ ½ heart</button>
      <button data-add="1" class="main">+ 1 heart</button>
      <button data-add="5">+ 5 hearts</button>
    </div>
    <div class="custom">
      <input id="amount" type="number" min="0.5" step="0.5" placeholder="Any amount you like (e.g. 2.5)">
      <button id="addCustom" class="main">Give</button>
    </div>
    <button id="take" class="take">− 1 heart 💔</button>
    <div class="tools">
      <button id="undo">↩︎ Undo last</button>
      <button id="reset">Start over</button>
    </div>
  </section>

  <section class="card">
    <h2>Heart history</h2>
    <ul class="log" id="log"></ul>
  </section>
</main>

<div class="win" id="win">
  <div class="card">
    <div class="big">💖</div>
    <h2>100 hearts!</h2>
    <p>From today on, you're my girlfriend, Kitty 🥰</p>
    <button class="main" id="closeWin">Yesss</button>
  </div>
</div>

<div class="win" id="ask">
  <div class="card">
    <div class="big" id="askEmoji"></div>
    <h2 id="askTitle"></h2>
    <p id="askText"></p>
    <div class="ask-btns">
      <button class="main" id="askNo"></button>
      <button class="quiet" id="askYes"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const GOAL = 100;
  const KEY = "lovemepls-hearts";
  const HEART = "M12 21s-7.5-4.6-9.6-9.2C.9 8.6 2.8 4.5 6.6 4.5c2.2 0 3.7 1.3 4.4 2.6.7-1.3 2.2-2.6 4.4-2.6 3.8 0 5.7 4.1 4.2 7.3C19.5 16.4 12 21 12 21z";

  // Shared storage: hearts live in Supabase so every device sees the same count.
  // Leave these empty to keep hearts only in this browser.
  const SUPABASE_URL = "https://lelufonkscrioecwmrfm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VWysRxe-FcaDqQSYzF2I5g_hsP9mUgQ"; // public key — never the secret/service_role key
  const db = SUPABASE_URL && SUPABASE_KEY && window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  // local copy: the whole list when offline-only, or a cache of the shared list
  let gifts = [];
  try { gifts = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  let writing = 0; // our own writes in flight, so their realtime echoes don't re-trigger reactions

  const $ = (id) => document.getElementById(id);
  const total = () => Math.max(0, Math.min(GOAL, gifts.reduce((s, g) => s + g.n, 0)));
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(gifts)); } catch (e) {} };
  const fmt = (n) => (Number.isInteger(n) ? n : n.toFixed(1));

  function heartSvg(fill, i) {
    // fill: 0 = empty, 0.5 = half, 1 = full
    return `<svg viewBox="0 0 24 24"><defs><clipPath id="c${i}"><rect width="${24 * fill}" height="24"/></clipPath></defs>
      <path d="${HEART}" fill="var(--empty)"/>
      ${fill ? `<path d="${HEART}" fill="var(--pink)" clip-path="url(#c${i})"/>` : ""}</svg>`;
  }

  function render() {
    const t = total();
    $("total").textContent = fmt(t);
    $("bar").style.width = (t / GOAL) * 100 + "%";
    $("left").textContent = t >= GOAL ? "Done! We're a couple now 💕" : `Only ${fmt(GOAL - t)} more to go!`;

    let html = "";
    for (let i = 0; i < GOAL; i++) html += heartSvg(Math.max(0, Math.min(1, t - i)), i);
    $("grid").innerHTML = html;

    $("log").innerHTML = gifts.length
      ? gifts.slice().reverse().map((g) =>
          `<li>${g.n > 0 ? "💗 Gave" : "💔 Took back"} ${fmt(Math.abs(g.n))} ${Math.abs(g.n) > 1 ? "hearts" : "heart"} <span>${new Date(g.at).toLocaleString("en-US", { dateStyle: "short", timeStyle: "short" })}</span></li>`).join("")
      : `<li class="empty">None yet... still waiting</li>`;

    const full = t >= GOAL;
    document.querySelectorAll("[data-add], #addCustom").forEach((b) => (b.disabled = full));
    $("undo").disabled = !gifts.length;
    $("take").disabled = t <= 0;
    if (!moodHeld) setMood();
  }

  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  const HAPPY_LINES = ["Yay! Thank you, Kitty! 💕", "My heart is so full! 🥰", "Best. Day. Ever!", "Hehe, one step closer 😝"];
  const POKE_LINES = ["Hehe, that tickles!", "Hi Kitty! 👋", "Got a heart for me? 🥺"];
  const givenToday = () => {
    const today = new Date().toDateString();
    return gifts.some((g) => g.n > 0 && new Date(g.at).toDateString() === today);
  };
  let happyTimer;
  let moodHeld = false; // while true, render() leaves the bear's current reaction alone

  function setMood(mood, line) {
    if (!mood) {
      if (total() >= GOAL) [mood, line] = ["love", "We're together now! 💖"];
      else if (givenToday()) [mood, line] = ["content", "Thanks for today's heart! See you tomorrow 😊"];
      else [mood, line] = ["waiting", `No heart today yet... I'm waiting <span class="dots"><span>.</span><span>.</span><span>.</span></span> 🥺`];
    }
    $("buddy").className = `card buddy ${mood}`;
    $("bubble").innerHTML = line;
    // restart the bubble pop animation
    $("bubble").style.animation = "none"; void $("bubble").offsetWidth; $("bubble").style.animation = "";
  }

  // show a reaction for a while (or until released when ms is omitted), then go back to the normal mood
  function react(mood, line, ms) {
    clearTimeout(happyTimer);
    moodHeld = true;
    setMood(mood, line);
    if (ms) happyTimer = setTimeout(release, ms);
  }
  function release() {
    clearTimeout(happyTimer);
    moodHeld = false;
    setMood();
  }
  const cheer = () => react("happy", pick(HAPPY_LINES), 2800);

  function ask({ emoji, title, text, no, yes }) {
    $("askEmoji").textContent = emoji;
    $("askTitle").textContent = title;
    $("askText").textContent = text;
    $("askNo").textContent = no;
    $("askYes").textContent = yes;
    $("ask").classList.add("show");
    return new Promise((resolve) => {
      const done = (answer) => { $("ask").classList.remove("show"); resolve(answer); };
      $("askNo").onclick = () => done(false);
      $("askYes").onclick = () => done(true);
    });
  }

  async function takeOne() {
    const n = Math.min(1, total());
    if (!(n > 0)) return;
    react("waiting", "Nooo, please don't take it 🥺");
    const sure = await ask({
      emoji: "🥺", title: "Take back a heart?",
      text: "Are you sure you want to take one heart back from me?",
      no: "No, keep it 💕", yes: "Yes...",
    }) && await ask({
      emoji: "😭", title: "Really, really?",
      text: "The bear will be so sad... Are you 100% sure?",
      no: "Okay, I'll keep it 💕", yes: "Yes, I'm sure",
    });
    if (!sure) return react("happy", "Phew! Thank you, Kitty 🥰", 2200);
    if (!(await addGift(-n))) return release();
    react("cry", "Waaah... my heart 💔😭", 3500);
    render();
  }

  // ---------- wardrobe: Kitty picks the bear's hat, shirt and pants ----------
  const OUTFIT_KEY = "lovemepls-outfit";
  const WARDROBE = {
    hat: ["Hat", [["🚫", "None"], ["🧶", "Beanie"], ["👑", "Crown"], ["🧢", "Cap"]]],
    shirt: ["Shirt", [["🚫", "None"], ["❤️", "Sweater"], ["🌊", "Stripes"], ["🤵", "Tux"]]],
    pants: ["Pants", [["🚫", "None"], ["👖", "Denim"], ["🟧", "Plaid"], ["🩰", "Tutu"]]],
  };
  const DRESS_LINES = ["Do I look cute? 🥰", "Ooh, I love it! 💕", "Kitty has the best taste ✨", "Dressed up just for you 😳"];
  let outfit = { hat: 0, shirt: 0, pants: 0 };
  try { Object.assign(outfit, JSON.parse(localStorage.getItem(OUTFIT_KEY))); } catch (e) {}
  const sameOutfit = (o) => Object.keys(outfit).every((k) => outfit[k] === Number(o[k]));

  $("wardrobe").innerHTML = Object.entries(WARDROBE).map(([part, [name, styles]]) =>
    `<div class="row"><b>${name}</b><div class="opts">${styles.map(([icon, label], i) =>
      `<button data-part="${part}" data-style="${i}"><i>${icon}</i>${label}</button>`).join("")}</div></div>`).join("");

  function wear(o) {
    for (const k of Object.keys(outfit)) outfit[k] = Math.max(0, Math.min(3, Number(o[k]) || 0));
    try { localStorage.setItem(OUTFIT_KEY, JSON.stringify(outfit)); } catch (e) {}
    $("clothes").setAttribute("class", `clothes hat-${outfit.hat} shirt-${outfit.shirt} pants-${outfit.pants}`);
    document.querySelectorAll("#wardrobe button").forEach((b) =>
      b.classList.toggle("on", outfit[b.dataset.part] === Number(b.dataset.style)));
  }

  $("wardrobe").addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const style = Number(b.dataset.style);
    wear({ ...outfit, [b.dataset.part]: style });
    react(style ? "love" : "poke", style ? pick(DRESS_LINES) : "Hehe, a bit chilly 🙈", 2200);
    if (!db) return;
    const { error } = await db.from("outfit").upsert({ id: 1, ...outfit, at: new Date().toISOString() });
    if (error) setStatus("⚠️ Outfit saved on this device only");
  });

  async function loadOutfit() {
    const { data } = await db.from("outfit").select("hat, shirt, pants").eq("id", 1).maybeSingle();
    if (data) wear(data);
  }

  // ---------- storage: Supabase when configured, this browser otherwise ----------
  const fromRow = (r) => ({ id: r.id, n: Number(r.n), at: Date.parse(r.at) });
  const setStatus = (text) => { $("sync").textContent = text; };
  const offline = () => setStatus("⚠️ Can't reach the server — check your connection and try again");

  async function addGift(n) {
    if (!db) { gifts.push({ n, at: Date.now() }); save(); return true; }
    writing++;
    try {
      const { data, error } = await db.from("hearts").insert({ n }).select().single();
      if (error) throw error;
      if (!gifts.some((g) => g.id === data.id)) gifts.push(fromRow(data)); // realtime may have added it already
      save();
      setStatus("☁️ Synced");
      return true;
    } catch (e) {
      offline();
      return false;
    } finally {
      writing--;
    }
  }

  // removes gifts matching `which` (all of them when omitted)
  async function removeGifts(which) {
    const gone = which ? gifts.filter(which) : gifts.slice();
    if (!gone.length) return;
    if (db) {
      writing++;
      try {
        const { error } = await db.from("hearts").delete().in("id", gone.map((g) => g.id));
        if (error) throw error;
      } catch (e) {
        return offline();
      } finally {
        writing--;
      }
    }
    gifts = gifts.filter((g) => !gone.includes(g));
    save();
    render();
  }

  async function loadShared() {
    setStatus("☁️ Syncing…");
    const { data, error } = await db.from("hearts").select("id, n, at").order("id");
    if (error) return setStatus("⚠️ Offline — showing the last hearts this device saw");
    gifts = data.map(fromRow);
    save();
    setStatus("☁️ Synced");
    render();
    loadOutfit();
  }

  // live updates: hearts given or taken back on another device show up here straight away
  function listen() {
    db.channel("hearts")
      .on("postgres_changes", { event: "*", schema: "public", table: "hearts" }, ({ eventType, new: row, old }) => {
        if (eventType === "INSERT") {
          if (gifts.some((g) => g.id === row.id)) return;
          const g = fromRow(row);
          gifts.push(g);
          save();
          if (!writing) {
            if (g.n > 0) { cheer(); floatHearts(g.n); }
            else react("cry", "Waaah... my heart 💔😭", 3500);
          }
          render();
          if (!writing && g.n > 0 && total() >= GOAL) setTimeout(() => $("win").classList.add("show"), 600);
        } else if (eventType === "DELETE") {
          gifts = gifts.filter((g) => g.id !== old.id);
          save();
          render();
        }
      })
      // load after subscribing so nothing given in between is missed
      .subscribe((state) => { if (state === "SUBSCRIBED") loadShared(); });
    // own channel, so a missing outfit table can never break the hearts
    db.channel("outfit")
      .on("postgres_changes", { event: "*", schema: "public", table: "outfit" }, ({ new: row }) => {
        if (!row || row.id !== 1 || sameOutfit(row)) return; // our own change echoing back
        wear(row);
        react("love", "Kitty picked a new outfit for me! 🥰", 2600);
      })
      .subscribe();
    // phones pause background tabs; catch up when the page comes back
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadShared(); });
  }

  function floatHearts(n) {
    const count = Math.min(12, Math.ceil(n * 2));
    for (let i = 0; i < count; i++) {
      const el = document.createElement("div");
      el.className = "float";
      el.textContent = "💗";
      el.style.left = 20 + Math.random() * 60 + "vw";
      el.style.top = 60 + Math.random() * 20 + "vh";
      el.style.animationDelay = i * 60 + "ms";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500 + i * 60);
    }
  }

  async function give(n) {
    n = Math.round(n * 2) / 2; // round to the nearest half heart
    if (!(n > 0)) return;
    const before = total();
    if (before >= GOAL) return;
    n = Math.min(n, GOAL - before);
    if (!(await addGift(n))) return;
    cheer();
    render();
    floatHearts(n);
    if (total() >= GOAL) setTimeout(() => $("win").classList.add("show"), 600);
  }

  document.querySelectorAll("[data-add]").forEach((b) =>
    b.addEventListener("click", () => give(parseFloat(b.dataset.add))));
  $("addCustom").addEventListener("click", () => { give(parseFloat($("amount").value)); $("amount").value = ""; });
  $("amount").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addCustom").click(); });
  $("take").addEventListener("click", takeOne);
  $("undo").addEventListener("click", () => { const last = gifts[gifts.length - 1]; removeGifts((g) => g === last); });
  $("reset").addEventListener("click", () => {
    if (confirm("Really clear all the hearts and start over? 🥲")) removeGifts();
  });
  $("closeWin").addEventListener("click", () => $("win").classList.remove("show"));
  $("avatarWrap").addEventListener("click", () => {
    if (moodHeld) return;
    react("poke", pick(POKE_LINES), 1600);
  });
  // switch back to "waiting" when a new day starts
  setInterval(() => { if (!moodHeld) setMood(); }, 60000);

  wear(outfit);
  render();
  if (db) listen();
  else if (SUPABASE_URL) setStatus("⚠️ Couldn't load the sync library — hearts are only saved on this device");
</script></body>
</html>
